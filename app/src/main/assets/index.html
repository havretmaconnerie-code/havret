<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Havret Chantier</title>
<style>
/* VOICE: outil de chef d'équipe, direct, lisible en plein soleil avec des gants.
   IDEA: la fiche de chantier pliée dans la cabine du camion : métrés, bon de commande, plan de toit, planning.
   PICTURE: le plan du toit vu du dessus, à l'échelle, avec sens de pose et palettes numérotées.
   COLOUR and TYPE: pétrole profond, béton clair, orange flamme; Archivo + Inter.
   LAYOUT: liste des chantiers, puis fiche en onglets : Métrés, Matériel, Palettes, Méthode, Planning, Contrôles. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f7f7,#0b181d);--card:light-dark(#fff,#11242c);--ink:light-dark(#11222a,#e8eff1);--mut:light-dark(#53656d,#a3b5bc);
--pet:light-dark(#0f3b4c,#0a2a36);--pet2:light-dark(#16546b,#2a7590);--con:light-dark(#eaf0f1,#16303a);--line:light-dark(#d4dde0,#24404b);--acc:#ff5a2e;--accd:light-dark(#d63d14,#ff7a55);--ok:light-dark(#2f8a57,#5cc48a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4vw,34px);font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:600}
p{margin:0}
header{position:sticky;top:0;z-index:20;background:var(--pet);color:#fff}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px}
.logo{display:flex;gap:9px;align-items:center;font:800 18px Archivo,sans-serif;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:0;font:600 16px Inter,sans-serif;cursor:pointer;background:var(--acc);color:#fff;white-space:nowrap;text-decoration:none}
.btn.gh{background:transparent;color:inherit;border:1.5px solid currentColor}.btn.sm{min-height:40px;padding:0 13px;font-size:15px}
.btn.ic{width:44px;padding:0;background:transparent;color:#fff;font-size:22px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.list{display:grid;gap:10px;margin-top:16px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.item:hover{border-color:var(--pet2)}.item small{color:var(--mut)}
.st{font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px;background:var(--con);white-space:nowrap}
.st.encours{background:var(--acc);color:#fff}.st.termine{background:var(--ok);color:#fff}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none;position:sticky;top:60px;background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:12px 12px;font-weight:600;font-size:15px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--acc)}.tabs button:focus-visible{outline:3px solid var(--acc)}
.sec{margin-top:18px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600}
label.f small{font-weight:400;color:var(--mut)}
input.t,select.t,textarea.t{width:100%;min-height:46px;font:16px Inter,sans-serif;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea.t{padding:10px 12px;min-height:90px}
input.n{text-align:right}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:1px}
.chk:has(input:checked) span{color:var(--mut);text-decoration:line-through}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi div{background:var(--pet);color:#fff;border-radius:12px;padding:12px 14px}
.kpi span{display:block;font-size:12px;color:#bcd3da}.kpi b{font:800 26px/1.15 Archivo,sans-serif;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:left;padding:8px 6px 8px 0;border-bottom:1.5px solid var(--line)}
td{padding:9px 6px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.r{text-align:right;white-space:nowrap}
tr.cat td{background:var(--con);font-weight:700;font-size:13px;padding:6px 8px}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.warn{background:light-dark(#fff3ee,#2a1a14);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;font-size:15px;margin-top:12px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.plan svg{display:block;width:100%;height:auto;max-height:70vh}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:12px}
.leg div{display:flex;gap:10px;align-items:center;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sw{width:26px;height:26px;border-radius:5px;flex:none;display:grid;place-items:center;color:#fff;font:700 12px Inter}
.steps{counter-reset:s;display:grid;gap:10px;margin-top:12px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.step::before{counter-increment:s;content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--pet);color:#fff;display:grid;place-items:center;font:800 17px Archivo,sans-serif}
.step p{color:var(--mut);font-size:15px;margin-top:3px}.step .h{float:right;font-weight:600;color:var(--accd);font-size:14px;margin-left:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.day h3{display:flex;justify-content:space-between;gap:10px}
.day ul{margin:8px 0 0;padding-left:18px;font-size:15px}.day li{margin:3px 0}
.bars{display:grid;gap:4px;margin-top:8px}
.bars div{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 4.5em;gap:8px;align-items:center;font-size:13px}
.bars i{display:block;height:12px;border-radius:3px;background:var(--pet2)}
.save{font-size:13px;color:#cfe0e5;white-space:nowrap}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:space-between;align-items:center;z-index:15}
.foot b{font:800 20px Archivo,sans-serif;white-space:nowrap}.foot small{display:block;color:var(--mut);font-size:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.ai ul{margin:6px 0 0;padding-left:18px;font-size:15px}.ai li{margin:3px 0}.ai h3{margin-top:14px}
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:28px 26px;margin-top:16px;font:14px/1.45 Inter,system-ui,sans-serif;max-width:820px}
.doc .dh{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.doc .dn{font:800 20px Archivo,sans-serif;color:#0f3b4c;margin-bottom:4px}
.doc .dc{min-width:200px;padding:10px 14px;border:1px solid #d4dde0;border-radius:6px}.doc .dl{font-size:11px;color:#667;text-transform:uppercase;letter-spacing:.04em}
.doc .dt{font:800 24px Archivo,sans-serif;margin:24px 0 6px;color:#0f3b4c}.doc .dm{display:flex;gap:24px;flex-wrap:wrap;font-size:13px}.doc .dm span{display:block;font-size:11px;color:#667}
.doc .do{margin:16px 0 8px}.doc p{margin:8px 0}
.doc .dtab{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}.doc .dtab th{border-bottom:2px solid #0f3b4c;color:#0f3b4c;font-size:11px;text-transform:uppercase;padding:6px 6px 6px 0}.doc .dtab td{border-bottom:1px solid #dde3e5;padding:8px 6px 8px 0;vertical-align:top}.doc .dtab small{color:#555}
.doc .dsum{margin:12px 0 0 auto;min-width:260px;border-collapse:collapse}.doc .dsum td{padding:5px 0 5px 20px;border:0}.doc .dsum .tt td{font-weight:800;font-size:16px;border-top:2px solid #0f3b4c;color:#0f3b4c}
.doc .dcond{margin-top:18px;font-size:12.5px}.doc .dcond h3{font-size:14px;color:#0f3b4c}.doc .dcond ul{padding-left:18px;margin:6px 0}
.doc .dsig{display:flex;gap:30px;justify-content:space-between;margin-top:26px;font-size:12.5px;flex-wrap:wrap}.doc .dfoot{margin-top:22px}
@media(max-width:600px){.doc{padding:18px 14px}.doc .dtab th:nth-child(4),.doc .dtab td:nth-child(4){display:none}}
@media print{body{background:#fff}header,.tabs,.kpi,.foot,.noprint,#app>.kpi{display:none!important}.wrap{padding:0}.doc{border:0;padding:0;max-width:none;margin:0}@page{size:A4;margin:16mm}}
.seg.nav{display:flex;flex-wrap:wrap;width:100%}.seg.nav button{flex:1 1 auto;text-align:center;padding:10px 8px;font-size:14px}
.qrb{display:grid;grid-template-columns:62mm 1fr;border-top:1px dashed #000;margin-top:24px;font:9pt/1.3 Arial,Helvetica,sans-serif;color:#000;page-break-inside:avoid;break-inside:avoid}.qrb h4{font-size:11pt;margin:0 0 6px}.qrb b{font-size:6.5pt;display:block;margin-top:5px}.qrb p{margin:0 0 3px;font-size:8.5pt}.qrr{padding:5mm;border-right:1px dashed #000}.qrp{padding:5mm}.qgrid{display:grid;grid-template-columns:52mm 1fr;gap:4mm}.qam{display:flex;gap:6mm;margin-top:4mm}.qdp{text-align:right;margin-top:6mm}.qbox{display:block;width:52mm;height:20mm;border:1px solid #000}.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
@media(max-width:600px){.qrb{grid-template-columns:1fr}.qrr{border-right:0;border-bottom:1px dashed #000}.qgrid{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;background:var(--card)}.seg button{all:unset;cursor:pointer;padding:10px 16px;font-size:15px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--pet);color:#fff}.seg button:focus-visible{outline:3px solid var(--acc)}
dialog{border:0;border-radius:16px;padding:20px;max-width:440px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
@media(max-width:600px){.hide-s{display:none}.tabs button{padding:12px 9px;font-size:14px}}
</style>
</head>

function plan(c){
 const T0=tasks(c),T=[...T0.filter(x=>x.k==='instal'),...T0.filter(x=>x.k==='evac'),...T0.filter(x=>x.k!=='instal'&&x.k!=='evac')],team=Math.max(1,+c.team||2),hd=Math.max(4,+c.hday||8.5),g=geo(c),days=[];let d={h:0,items:[]};
 /* Les couches qui ouvrent puis referment le toit sont faites par bandes : chaque soir, tout ce qui est ouvert est fermé. */
 const GK=c.type==="mur"?[]:["depose","support","prim","pv","isoP","iso","b1","fpo","epdm","res"];
 const grp=T.filter(x=>GK.includes(x.k)),gph=grp.reduce((s,x)=>s+x.ph,0),bands=[];
 const push=(n,h,part)=>{d.items.push({n,h,part});d.h+=h;};
 const next=()=>{days.push(d);d={h:0,items:[]};};
 let groupDone=!grp.length;
 for(const x of T){
  if(GK.includes(x.k)){if(groupDone)continue;groupDone=true;
   let rest=gph/team,doneA=0;
   while(rest>0.01){let free=hd-d.h;if(free<=0.01){next();continue;}const take=Math.min(free,rest),a=g.A*take/(gph/team);
    if(a<1&&bands.length){const lb=bands[bands.length-1];lb.a1+=a;doneA+=a;const li=days.length&&!d.items.length?days[days.length-1].items:d.items;const it=li[li.length-1];if(it)it.h+=take;d.h+=take;rest-=take;continue;}
    bands.push({day:days.length+1,a0:doneA,a1:doneA+a});doneA+=a;
    push(`Bande ${bands.length} · ${nf(a)} m² : ${grp.map(y=>y.n.replace(/ \(.*\)$/,'')).map(n=>n.charAt(0).toLowerCase()+n.slice(1)).join(' → ')}, refermée le soir`,take,true);rest-=take;}
   continue;}
  let rest=x.ph/team;
  while(rest>0.01){const free=hd-d.h;if(free<=0.01){next();continue;}const take=Math.min(free,rest);push(x.n,take,x.ph/team>take+0.01||d.items.some(i=>i.n===x.n));rest-=take;}
 }
 if(d.items.length)days.push(d);
 return{T,days,team,hd,bands,grp,total:T.reduce((s,x)=>s+x.ph,0)};
}
function pallets(c){
 const M=materials(c),P1=[],P2=[];let accKg=0,accN=0;
 for(const m of M){if(m.k==="dep")continue;
  if(m.perPal>0){const n=ceil(m.packN/m.perPal);for(let i=0;i<n;i++){const q=i<n-1?m.perPal:m.packN-m.perPal*(n-1);(m.use>=7?P2:P1).push({k:m.k,name:m.name,q,pack:m.pack,kg:m.kg/m.packN*q,use:m.use});}}
  else if(m.use<7){accKg+=m.kg;accN++;}else{(P2).push({k:m.k,name:m.name,q:m.packN,pack:m.pack,kg:m.kg,use:m.use,loose:true});}
 }
 if(accN)P1.push({k:"acc",name:"Palette accessoires (primaire, gaz, colles, évacuations…)",q:accN,pack:"articles",kg:accKg,use:1});
 P1.sort((a,b)=>a.use-b.use);

function roofSVG(c,P1,bands){
 const g=geo(c),L=Math.max(g.L,1),W=Math.max(g.W,1),m=1.5,bas=c.bas||"gauche",lift=c.lift||"bas";
 const axisX=bas==="gauche"||bas==="droite";
 /* zone de stockage : bande côté point haut (opposé au point bas), retrait du bord */
 const edge=c.garde?0.6:2,pw=1.2,pd=1.0,gap=0.8;
 const bandLen=axisX?W:L, cnt=P1.length;
 const perRow=Math.max(1,Math.floor((bandLen-2*edge+gap)/(pw+gap)));
 const pos=[];
 for(let i=0;i<cnt;i++){const row=Math.floor(i/perRow),col=i%perRow;
  const along=edge+col*(pw+gap), deep=edge+row*(pd+1.2);
  let x,y,w,h;
  if(axisX){w=pd;h=pw;y=along;x=bas==="gauche"?L-deep-pd:deep;}else{w=pw;h=pd;x=along;y=bas==="haut"?W-deep-pd:deep;}
  pos.push({x,y,w,h});}

 const liftPt={gauche:[0,W/2],droite:[L,W/2],haut:[L/2,0],bas:[L/2,W]}[lift];
 const order=pos.map((p,i)=>({i,d:Math.hypot(p.x+p.w/2-liftPt[0],p.y+p.h/2-liftPt[1])})).sort((a,b)=>a.d-b.d);
 const placed=P1.map((p,k)=>({...p,...pos[order[k].i],n:k+1}));
 const fs=Math.max(0.45,Math.min(L,W)/18);
 let s=`<svg viewBox="${-m} ${-m} ${L+2*m} ${W+2*m}" role="img" aria-label="Plan du toit vu du dessus avec palettes">
 <rect x="0" y="0" width="${L}" height="${W}" fill="#3b4348" stroke="#11222a" stroke-width="${fs*0.25}"/>`;
 /* sens de pose : flèches du point bas vers le point haut */
 const arr=[];for(let k=1;k<=3;k++){const f=k/4;if(axisX){const y=W*f,x0=bas==="gauche"?L*0.08:L*0.92,x1=bas==="gauche"?L*0.55:L*0.45;arr.push([x0,y,x1,y]);}else{const x=L*f,y0=bas==="haut"?W*0.08:W*0.92,y1=bas==="haut"?W*0.55:W*0.45;arr.push([x,y0,x,y1]);}}
 s+=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff5a2e"/></marker></defs>`;
 s+=arr.map(a=>`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" stroke="#ff5a2e" stroke-width="${fs*0.22}" stroke-dasharray="${fs*0.6} ${fs*0.35}" marker-end="url(#ah)"/>`).join('');

  if(axisX){const x=bas==="gauche"?L*f:L*(1-f);s+=`<line x1="${x}" y1="0" x2="${x}" y2="${W}" stroke="#7fb6c7" stroke-width="${fs*0.1}" stroke-dasharray="${fs*0.3} ${fs*0.3}"/><text x="${x+(bas==="gauche"?-1:1)*fs*0.3}" y="${W-fs*0.4}" text-anchor="${bas==="gauche"?"end":"start"}" font-size="${fs*0.75}" font-family="Inter" fill="#7fb6c7">B${i+1}</text>`;}
  else{const y=bas==="haut"?W*f:W*(1-f);s+=`<line x1="0" y1="${y}" x2="${L}" y2="${y}" stroke="#7fb6c7" stroke-width="${fs*0.1}" stroke-dasharray="${fs*0.3} ${fs*0.3}"/><text x="${fs*0.4}" y="${y+(bas==="haut"?-1:1)*fs*0.3+(bas==="haut"?0:fs*0.6)}" font-size="${fs*0.75}" font-family="Inter" fill="#7fb6c7">B${i+1}</text>`;}});
 /* évacuations sur le côté bas */
 const ne=Math.max(0,+c.evac||0);for(let k=0;k<ne;k++){const f=(k+1)/(ne+1);const ex=axisX?(bas==="gauche"?0.6:L-0.6):L*f,ey=axisX?W*f:(bas==="haut"?0.6:W-0.6);s+=`<circle cx="${ex}" cy="${ey}" r="${fs*0.55}" fill="#5fa6bd" stroke="#fff" stroke-width="${fs*0.12}"/>`;}
 /* départ */
 const st=axisX?[bas==="gauche"?0.3:L-0.3,W*0.5]:[L*0.5,bas==="haut"?0.3:W-0.3];
 s+=`<circle cx="${st[0]}" cy="${st[1]}" r="${fs*0.9}" fill="#2f8a57" stroke="#fff" stroke-width="${fs*0.15}"/><text x="${st[0]}" y="${st[1]+fs*0.35}" text-anchor="middle" font-size="${fs}" font-family="Inter" font-weight="700" fill="#fff">D</text>`;
 /* levage */
 s+=`<g transform="translate(${liftPt[0]} ${liftPt[1]})"><rect x="${-fs}" y="${-fs}" width="${fs*2}" height="${fs*2}" rx="${fs*0.3}" fill="#ff5a2e"/><text y="${fs*0.4}" text-anchor="middle" font-size="${fs*1.1}" font-family="Inter" font-weight="700" fill="#fff">G</text></g>`;
 /* palettes */
 s+=placed.map(p=>`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${COL[p.k]||'#888'}" stroke="#fff" stroke-width="${fs*0.1}"/><text x="${p.x+p.w/2}" y="${p.y+p.h/2+fs*0.33}" text-anchor="middle" font-size="${fs*0.95}" font-family="Inter" font-weight="700" fill="#fff">${p.n}</text>`).join('');
 s+=`<text x="${L/2}" y="${-m*0.35}" text-anchor="middle" font-size="${fs*0.9}" font-family="Inter" fill="currentColor">${nf(L,1)} m</text><text x="${-m*0.35}" y="${W/2}" text-anchor="middle" font-size="${fs*0.9}" font-family="Inter" fill="currentColor" transform="rotate(-90 ${-m*0.35} ${W/2})">${nf(W,1)} m</text></svg>`;
 const over=cnt>perRow*Math.max(1,Math.floor(((axisX?L:W)*0.45-edge)/(pd+1.2)));
 return{svg:s,placed,over};
}

const alertBox=t=>{const d=$('#dlg');d.innerHTML=`<p>${t}</p><div style="text-align:right;margin-top:14px"><button class="btn sm" type="button" id="aok">OK</button></div>`;d.showModal();$('#aok').onclick=()=>d.close();};
const tvaOf=(ttc,t)=>Math.round(ttc*t/(100+t)*100)/100;
const inPer=(d)=>{if(!d)return false;const y=+d.slice(0,4),m=+d.slice(5,7);if(y!==cptYear)return false;if(cptPer==='an')return true;if(cptPer[0]==='T')return Math.ceil(m/3)===+cptPer[1];if(cptPer[0]==='S')return (m<=6?1:2)===+cptPer[1];return true;};
function factures(){return list.filter(c=>c.factNo).map(c=>{const PO=docLines(c,true),ht=PO.reduce((s,p)=>s+p.tot,0),tva=ht*P.tva/100;const d=new Date((c.factDate||today())+'T12:00');d.setDate(d.getDate()+(+P.ent.jours||30));const ech=d.toISOString().slice(0,10);const late=!c.factPaid&&ech<today();return{c,no:c.factNo,date:c.factDate,ech,ht,tva,ttc:ht+tva,acc:+c.acompteRecu||0,paid:!!c.factPaid,paidDate:c.factPaidDate||'',late};});}
function totals(){const F=factures();let rec={ht:0,tva:0,ttc:0},dep={ht:0,tva:0,ttc:0};const cats={};
 for(const f of F)if(f.paid&&inPer(f.paidDate)){rec.ttc+=f.ttc;rec.tva+=f.tva;rec.ht+=f.ht;}
 for(const e of cpt){if(!inPer(e.date))continue;const t=+e.ttc||0,v=+e.tva||0;if(e.kind==='rec'){rec.ttc+=t;rec.tva+=v;rec.ht+=t-v;}else{dep.ttc+=t;dep.tva+=v;dep.ht+=t-v;cats[e.cat]=(cats[e.cat]||0)+(t-v);}}
 const C=P.cpt,due=!C.assuj?0:C.meth==='tdfn'?rec.ttc*(+C.tdfn||0)/100:rec.tva-dep.tva;

 return{F,rec,dep,cats,due,res:rec.ht-dep.ht,yrCA};}

function exportCsv(){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;

  try{const r=await sample.json(prompt,{images:[b],modelTier:'complex'});
   const taux=[8.1,2.6,3.8,0].includes(+r.taux_tva)?+r.taux_tva:8.1,ttc=+r.total_ttc||0;
   await saveCpt({id:'e'+Date.now().toString(36)+i,kind:r.type==='recette'?'rec':'dep',date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:today(),tiers:String(r.tiers||'').slice(0,80),num:String(r.numero||'').slice(0,40),desc:String(r.description||'').slice(0,160),cat:r.type==='recette'?'div':(CATS[r.categorie]?r.categorie:'div'),ttc,taux,tva:r.tva!=null&&+r.tva>=0?Math.round(+r.tva*100)/100:tvaOf(ttc,taux),pay:r.a_payer?'a_payer':'paye',moyen:['carte','especes','twint','virement','facture'].includes(r.moyen)?r.moyen:'carte',check:true});ok++;
  }catch(e){ko++;}}
 st(`${ok} document${ok>1?'s':''} lu${ok>1?'s':''}${ko?`, ${ko} illisible${ko>1?'s':''} (à saisir à la main)`:''}. Vérifie les lignes marquées « à vérifier ».`);render();
}

				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {

			}

						}

				}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

function clientsAll(){const M={};const key=s=>String(s||'').trim().toLowerCase();
 for(const k of CLI.list){M[key(k.nom)]={...k,ch:[]};}
 for(const c of list){if(!c.client)continue;const k=key(c.client);M[k]=M[k]||{id:'',nom:c.client,adresse:c.adresse,ch:[]};M[k].ch.push(c);if(!M[k].adresse)M[k].adresse=c.adresse;}
 return Object.values(M).sort((a,b)=>a.nom.localeCompare(b.nom));}
function entretienDue(){return list.filter(c=>c.entretien&&c.entretien.on).map(c=>{const ref=c.entretien.last||c.recDate||c.factDate||c.start||today();const d=new Date(ref+'T12:00');d.setMonth(d.getMonth()+(+c.entretien.m||12));return{c,next:d.toISOString().slice(0,10)};}).sort((a,b)=>a.next.localeCompare(b.next));}

 <div class="card sec"><h2>Contrôles d'entretien</h2>${D.length?`<table style="margin-top:8px"><tbody>${D.map(x=>`<tr style="${x.next<=S?'background:light-dark(#fff3ee,#2a1a14)':''}"><td><b>${esc(x.c.client||x.c.nom)}</b> · ${esc(x.c.nom||'')}<br><small style="color:${x.next<=S?'var(--accd)':'var(--mut)'}">Prochain contrôle : ${fd(x.next)}${x.c.entretien.prix?' · CHF '+nf(x.c.entretien.prix):''}</small></td><td class="r"><button class="btn sm" type="button" data-prop="${x.c.id}" style="min-height:34px">Proposer</button><br><button class="btn gh sm" type="button" data-done="${x.c.id}" style="min-height:34px;margin-top:4px">Fait</button></td></tr>`).join('')}</tbody></table>`:'<p class="note">Active « Contrôle d\'entretien » dans l\'onglet Suivi d\'un chantier terminé : l\'application te rappellera de proposer le contrôle chaque année.</p>'}</div>
 <div class="list">${A.length?A.map(k=>`<div class="card"><h3>${esc(k.nom)}</h3><small style="color:var(--mut)">${esc([k.adresse,k.tel,k.mail].filter(Boolean).join(' · '))}</small>${k.ch.length?`<p class="note">${k.ch.length} chantier${k.ch.length>1?'s':''} : ${k.ch.map(c=>esc(c.nom||'Sans nom')).join(', ')} · facturé ${chf(k.ch.filter(c=>c.factNo).reduce((s,c)=>s+docLines(c,true).reduce((a,p)=>a+p.tot,0),0))} HT</p>`:''}${k.notes?`<p class="note">${esc(k.notes)}</p>`:''}<div style="margin-top:8px"><button class="btn gh sm" type="button" data-cli="${esc(k.id||'')}" data-cn="${esc(k.nom)}" style="min-height:34px">Modifier</button></div></div>`).join(''):'<div class="card empty">Aucun client. Ils s\'ajoutent tout seuls quand tu indiques un client dans un chantier.</div>'}</div>`;

 app.querySelectorAll('[data-cli]').forEach(b=>b.onclick=()=>{const k=CLI.list.find(x=>x.id===b.dataset.cli)||{id:uid('k'),nom:b.dataset.cn,adresse:(A.find(a=>a.nom===b.dataset.cn)||{}).adresse||''};editClient(JSON.parse(JSON.stringify(k)));});

async function stockOut(c){const M=materials(c);let n=0;cur.stockUsed=cur.stockUsed||{};for(const m of M){let need=m.packN-(cur.stockUsed[m.pid]||0);for(const s of STK.list.filter(s=>s.pid&&s.pid===m.pid)){if(need<=0)break;const t=Math.min(need,+s.q||0);if(t>0){s.q=(+s.q||0)-t;need-=t;n++;cur.stockUsed[m.pid]=(cur.stockUsed[m.pid]||0)+t;await STK.save(s);}}}
 cur.stockOut=today();queue();alertBox(n?'Stock mis à jour : les articles utilisés ont été sortis.':'Aucun article en stock ne correspond à ce chantier.');render();}

function editRegie(r){const d=$('#dlg');d.innerHTML=`<h2>Bon de régie ${r.no}</h2><div class="g2" style="margin-top:12px"><label class="f">Date<input class="t" type="date" id="g_d" value="${esc(r.date)}"></label><label class="f">Heures par ouvrier<input class="t n" type="number" step="0.25" min="0" id="g_h" value="${r.h}"></label><label class="f">Nombre d'ouvriers<input class="t n" type="number" min="1" id="g_n" value="${r.n}"></label></div>

 <div style="display:flex;gap:10px;justify-content:space-between;margin-top:14px">${(cur.regies||[]).some(x=>x.id===r.id)?'<button class="btn gh sm" type="button" id="g_del" style="color:var(--accd)">Supprimer</button>':'<span></span>'}<span style="display:flex;gap:10px"><button class="btn gh sm" type="button" id="g_no">Annuler</button><button class="btn sm" type="button" id="g_ok">Enregistrer</button></span></div>`;d.showModal();
 let pad=null;if($('#gsig')){pad=sigPad($('#gsig'));$('#gsigx').onclick=()=>pad.clear();}
 if($('#g_rs'))$('#g_rs').onclick=()=>{r.sig='';d.close();editRegie(r);};
 $('#g_no').onclick=()=>d.close();
 if($('#g_del'))$('#g_del').onclick=()=>{cur.regies=cur.regies.filter(x=>x.id!==r.id);queue();d.close();render();};
 $('#g_ok').onclick=()=>{Object.assign(r,{date:$('#g_d').value,h:+$('#g_h').value||0,n:+$('#g_n').value||1,desc:$('#g_t').value.trim(),who:$('#g_w').value.trim(),mat:$('#g_m').value.split('\n').map(l=>l.split(';').map(x=>x.trim())).filter(a=>a[0]).map(([dd,q,pu])=>({d:dd,q:+String(q||'1').replace(',','.')||1,pu:+String(pu||'0').replace(',','.')||0}))});if(pad){const s=pad.data();if(s){r.sig=s;r.sigDate=today();}}
  cur.regies=cur.regies||[];const i=cur.regies.findIndex(x=>x.id===r.id);if(i<0)cur.regies.push(r);else cur.regies[i]=r;queue();d.close();render();};}

function outils(c){const g=geo(c),A=g.A,isRoof=c.type!=="mur",hasIso=isRoof&&+c.iso>0,bit=c.sys==="bitume",flame=bit||(c.sys!=="resine"&&hasIso),reno=c.etat==="reno",

 const tm=Math.max(1,+c.team||1),add=(cat,k,t)=>{(T[cat]=T[cat]||[]).push([k,t]);},s=n=>n>1?'s':'';
 const E="Sécurité et protection";
 add(E,"casq",`Casques (${tm})`);add(E,"lun",`Lunettes de protection (${tm})`);add(E,"gcuir",`Gants de travail cuir (${tm*2} paires)`);

 if(isRoof&&!c.garde){add(E,"harn",`Harnais + longes + absorbeurs (${tm})`);add(E,"anc","Points d'ancrage / ligne de vie provisoire");add(E,"bali","Balisage zone de chute : ruban, chandelles, piquets");}
 if(flame){add(E,"ext",`Extincteur${s(Math.min(tm,3))} à poudre 6 kg (${Math.min(tm,3)})`);add(E,"cfeu","Couverture anti-feu + seau d'eau");}
 add(E,"trou","Trousse de secours"+(res||colle||flame?" + rince-œil":""));add(E,"sol","Crème solaire, casquettes, eau à boire");
 const AC="Accès et levage";add(AC,"ech","Échelle (dépasse de 1 m, attachée en haut)");add(AC,"poul","Corde + poulie ou seau de levage pour le petit matériel");add(AC,"sang","Sangles d'arrimage (camion et toit)");
 const M="Mesure et traçage";add(M,"metr",`Mètres ruban 5 m (${tm})`);add(M,"deca","Décamètre 30 m");add(M,"cord","Cordeau à tracer + craie");add(M,"cray","Crayons de charpentier, marqueurs indélébiles");
 add(M,"niv","Niveau 60 cm + règle alu 2 m, équerre");if(reno||res)add(M,"hum","Humidimètre (support sec avant de poser)");if(res)add(M,"therm","Thermomètre de surface (point de rosée)");
 const C="Coupe";add(C,"cut",`Cutters (${tm+1})`);add(C,"lamd","Lames de cutter droites (boîte de 100)");
 if(bit||colle||reno)add(C,"lamc","Lames crochet (boîte)");add(C,"cis","Ciseaux forts"+(res||rac?" (voile de renfort)":""));
 if(hasIso){add(C,"sciso","Scie égoïne / scie à isolant");add(C,"cutiso","Couteau à isolant long");}
 add(C,"disq","Disqueuse 125 mm + disques métal (×10)"+(reno?" + disques diamant":""));
 if(c.sys==="fpo"||(+c.acrH||0)>0||reno)add(C,"cist","Cisailles à tôle droite et gauche, pince à plier");add(C,"scim","Scie à métaux");
 const O="Outillage à main et électroportatif";
 add(O,"viss","Visseuses + embouts + 2 batteries chacune + chargeurs");add(O,"perf","Perforateur + forets béton 6–12 mm");
 if(+c.evac>0||+c.trav>0)add(O,"cloc","Scies cloches (naissances, traversées)");add(O,"form","Forets métal");
 add(O,"mart","Marteau, massette, burin, pied de biche");add(O,"pinc","Pinces (multiprise, coupante), tournevis, jeu de clés");
 add(O,"mast","Pistolet à mastic + cartouches (mastic PU / bitumineux)");if(c.sys==="fpo"||(+c.acrH||0)>0||accQ(c,"couv")>0)add(O,"riv","Riveteuse + rivets, vis à tôle");
 if(accQ(c,"solin")+accQ(c,"couv")>0)add(O,"for6","Forets béton 6 mm de rechange (×3) pour chevilles à frapper");

 add(O,"vis","Assortiment vis, chevilles, rondelles");add(O,"agra","Agrafeuse + agrafes");add(O,"scot","Ruban adhésif toilé, ruban de masquage");
 const EL="Électricité";add(EL,"enr","Enrouleur 50 m + rallonges");add(EL,"mult","Multiprise de chantier");add(EL,"proj","Projecteur LED (hiver, fin de journée)");add(EL,"gen","Groupe électrogène si pas de courant sur place");

  add(F,"sond","Sonde / tournevis de contrôle des soudures");add(F,"net","Nettoyant / activateur membrane");add(F,"chif","Chiffons blancs non pelucheux");add(F,"rcol","Rouleaux et pinceaux à colle, bacs");}
 if(c.sys==="epdm"){const D="Membrane EPDM";add(D,"rcol","Rouleaux à colle + manches, bacs");add(D,"pcol","Pinceaux à colle");add(D,"repd","Roulettes silicone de marouflage");add(D,"pad","Tampons / nettoyant primaire");add(D,"chif","Chiffons propres");}
 if(res||rac){const R=res?"Résine liquide":"Raccords résine (seuils, traversées, angles)";

  add(R,"rres","Rouleaux à résine (spéciaux solvants) + manches");add(R,"pin","Pinceaux plats 30, 50 et 80 mm (plusieurs de chaque)");add(R,"bacr","Bacs à rouleau");
  add(R,"cisv","Ciseaux pour le voile");add(R,"masq2","Ruban de masquage (bords nets)");add(R,"glat2","Gants nitrile (prévoir 2 paires par personne et par jour)");
  add(R,"chif","Chiffons, papier absorbant");add(R,"dil","Nettoyant / diluant pour outils");add(R,"bach","Bâche de protection au sol");
  if(res){add(R,"clou","Semelles à clous");add(R,"crant","Raclette crantée / lisseuse");}add(R,"tim","Minuteur (durée de vie du mélange)");}
 if(hasIso){const I="Isolation";add(I,"rege","Règle de coupe longue");add(I,"poid","Lests / sacs pour tenir les panneaux au vent");}
 if(isRoof&&c.prot==="gravier")add("Protection","grav","Pelles, râteaux, brouette (répartition du gravier)");
 if(isRoof&&c.prot==="dalles")add("Protection","dal","Clé de réglage des plots, cales, maillet caoutchouc");
 if(isRoof&&c.prot==="vege")add("Protection","veg","Pelles, râteaux, arrosage");
 const FJ="Fin de journée";add(FJ,"bach","Bâches + lests (isolation, raccords non terminés)");add(FJ,"sacp","Sacs poubelle, big bag déchets");add(FJ,"eau","Bidon d'eau + savon (se laver les mains)");
 const DC="Documents";add(DC,"docs","Plan, devis, liste de matériel, bons de livraison (téléphone chargé)");add(DC,"phot","Photos avant / pendant / après (pour le rapport)");
 const base=(P.outilsBase||'').split('\n').map(x=>x.trim()).filter(Boolean);base.forEach((t,i)=>add("Toujours emporter","b"+i+"_"+t.slice(0,12),t));
 const plus=(c.outilsPlus||'').split('\n').map(x=>x.trim()).filter(Boolean);plus.forEach((t,i)=>add("Pour ce chantier","p"+i+"_"+t.slice(0,12),t));

function vOutils(c){const T=outils(c),ok=c.outil||{};let n=0,d=0;
 const h=Object.entries(T).map(([cat,a])=>`<h3 style="margin-top:12px">${cat}</h3>${a.map(([k,t])=>{n++;if(ok[k])d++;return `<label class="chk"><input type="checkbox" data-ot="${esc(k)}" ${ok[k]?'checked':''}><span>${esc(t)}</span></label>`;}).join('')}`).join('');
 return `<div class="card sec"><h2>Outillage et petit matériel</h2><p class="note" style="margin-top:4px">Calculé selon le système, l'isolation, la rénovation, les raccords et l'équipe. Coche au chargement du camion : ${d}/${n}.</p>${h}
 <label class="f" style="margin-top:14px">Ajouter pour ce chantier <small>un outil par ligne</small><textarea class="t" id="outilsPlus" style="min-height:70px">${esc(c.outilsPlus||'')}</textarea></label>

 <p class="note">Ce que tu emportes sur tous les chantiers se règle dans ⚙ → « Toujours emporter ».</p></div>`;}
function outilsTxt(c){const T=outils(c);return `Outillage – ${c.nom||'chantier'}${c.adresse?' ('+c.adresse+')':''}\n`+Object.entries(T).map(([cat,a])=>`\n${cat.toUpperCase()}\n`+a.map(([k,t])=>`${(c.outil||{})[k]?'☑':'☐'} ${t}`).join('\n')).join('\n');}
function bindOutils(){const b=$('#otsend');if(b)b.onclick=()=>{const t=outilsTxt(cur);if(window.Android&&window.Android.share){window.Android.share(t);return;}navigator.clipboard.writeText(t).then(()=>{b.textContent='Copié ✓';setTimeout(()=>b.textContent='Copier la liste',1500);},()=>{b.textContent='Copie impossible';});};

const lsSet=(k,v)=>{localStorage.setItem(k,v);scheduleBackup();};
let bkT=null;
const canAutoBk=()=>!!(window.Android&&window.Android.saveBackup);
const bkGet=k=>{try{return localStorage.getItem(k)||'';}catch(_){return '';}};
const bkSetMeta=(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}};
function backupData(){return{havret:2,app:'Havret Chantier',date:new Date().toISOString(),chantiers:list,params:P,compta:cpt,ouvriers:OUV.list,clients:CLI.list,stock:STK.list,photos:PH.list};}
function scheduleBackup(){if(!canAutoBk())return;clearTimeout(bkT);bkT=setTimeout(doBackup,4000);}
function doBackup(){if(!canAutoBk())return false;try{const r=window.Android.saveBackup(`havret-sauvegarde-${today()}.json`,JSON.stringify(backupData()));if(String(r).startsWith('ok')){bkSetMeta('havret-lastbk',new Date().toISOString());return true;}}catch(_){}return false;}
const fdt=s=>{if(!s)return 'jamais';const d=new Date(s);return d.toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit',year:'numeric'})+' à '+d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});};
const sentOld=()=>{const s=bkGet('havret-lastsend');return !s||(Date.now()-new Date(s))/864e5>7;};
function bkBanner(){if(!canAutoBk())return '';return sentOld()&&(list.length||cpt.length)?`<div class="warn">Sauvegarde automatique sur le téléphone : ${fdt(bkGet('havret-lastbk'))}. Pense à <b>envoyer une copie hors du téléphone</b> (e-mail, Drive) au moins une fois par semaine. <button class="btn sm" type="button" id="bksend" style="min-height:34px;margin-left:6px">Envoyer maintenant</button></div>`:`<p class="note">Sauvegarde automatique : ${fdt(bkGet('havret-lastbk'))}</p>`;}
function bkSend(){doBackup();if(window.Android&&window.Android.shareBackup){const r=window.Android.shareBackup();if(String(r).startsWith('ok')){bkSetMeta('havret-lastsend',new Date().toISOString());return;}}
 const t=JSON.stringify(backupData());if(t.length<400000&&window.Android&&window.Android.share){window.Android.share(t);bkSetMeta('havret-lastsend',new Date().toISOString());}else navigator.clipboard.writeText(t).then(()=>{bkSetMeta('havret-lastsend',new Date().toISOString());alertBox('Sauvegarde copiée : colle-la dans un e-mail ou une note pour la garder.');},()=>alertBox('Impossible de copier ici.'));}
function bkSection(){return `<h3 style="margin-top:4px">Sauvegarde</h3>${canAutoBk()?`<p class="note">Automatique après chaque modification, dans <b>Téléchargements / Havret Chantier</b> sur ce téléphone (un fichier par jour, 14 jours gardés). Dernière : ${fdt(bkGet('havret-lastbk'))}. Dernier envoi hors du téléphone : ${fdt(bkGet('havret-lastsend'))}.</p>`:`<p class="note">${local?'Données enregistrées sur cet appareil.':'Tes données sont enregistrées en ligne avec ton compte Claude.'} Tu peux garder une copie à part.</p>`}
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">${canAutoBk()?'<button class="btn sm" type="button" id="bknow">Sauvegarder maintenant</button>':''}<button class="btn gh sm" type="button" id="bksend2">${canAutoBk()?'Envoyer une copie (e-mail, Drive…)':'Copier une sauvegarde'}</button><label class="btn gh sm filebtn">Restaurer depuis un fichier<input type="file" accept=".json,application/json,text/plain" id="bkfile"></label><button class="btn gh sm" type="button" id="bkpaste">Coller une sauvegarde</button></div>`;}
function bindBk(d){if(d.querySelector('#bknow'))d.querySelector('#bknow').onclick=()=>{const ok=doBackup();alertBox(ok?'Sauvegarde enregistrée dans Téléchargements / Havret Chantier.':'La sauvegarde a échoué.');};
 d.querySelector('#bksend2').onclick=()=>{d.close();bkSend();};
 d.querySelector('#bkfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{d.close();askRestore(r.result);};r.readAsText(f);};
 d.querySelector('#bkpaste').onclick=()=>{d.innerHTML=`<h2>Coller une sauvegarde</h2><textarea class="t" id="bk" style="min-height:160px"></textarea><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn gh sm" type="button" id="bno">Annuler</button><button class="btn sm" type="button" id="bok">Continuer</button></div>`;d.querySelector('#bno').onclick=()=>d.close();d.querySelector('#bok').onclick=()=>{const t=d.querySelector('#bk').value;d.close();askRestore(t);};};}
function askRestore(txt){let o;try{o=JSON.parse(txt);if(!o||!o.havret)throw 0;}catch(_){alertBox("Ce fichier n'est pas une sauvegarde Havret Chantier.");return;}
 const n=(o.chantiers||o.list||[]).length,d=$('#dlg');
 d.innerHTML=`<h2>Restaurer la sauvegarde</h2><p style="margin-top:8px">Sauvegarde du ${o.date?fdt(o.date):'(date inconnue)'} : ${n} chantier${n>1?'s':''}, ${(o.compta||[]).length} écriture${(o.compta||[]).length>1?'s':''} comptable${(o.compta||[]).length>1?'s':''}, ${(o.clients||[]).length} client${(o.clients||[]).length>1?'s':''}, ${(o.stock||[]).length} article${(o.stock||[]).length>1?'s':''} en stock, ${(o.photos||[]).length} photo${(o.photos||[]).length>1?'s':''}.</p>
 <p class="note"><b>Ajouter</b> garde tes données actuelles et ajoute ce qui manque. <b>Tout remplacer</b> efface les données actuelles.</p>
 <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px"><button class="btn gh sm" type="button" id="rno">Annuler</button><button class="btn gh sm" type="button" id="rrep" style="color:var(--accd)">Tout remplacer</button><button class="btn sm" type="button" id="radd">Ajouter</button></div>`;d.showModal();
 $('#rno').onclick=()=>d.close();$('#radd').onclick=async()=>{d.close();await restoreData(o,false);};$('#rrep').onclick=async()=>{d.close();await restoreData(o,true);};}
async function restoreData(o,replace){
 const sets=[['chantiers',o.chantiers||o.list||[]],['compta',o.compta||[]],['ouvriers',o.ouvriers||[]],['clients',o.clients||[]],['stock',o.stock||[]],['photos',o.photos||[]]];
 const get=n=>n==='chantiers'?list:n==='compta'?cpt:{ouvriers:OUV,clients:CLI,stock:STK,photos:PH}[n].list;
 const put=(n,a)=>{if(n==='chantiers')list=a;else if(n==='compta')cpt=a;else ({ouvriers:OUV,clients:CLI,stock:STK,photos:PH}[n].list=a);};
 let added=0;
 for(const [n,arr] of sets){const curA=get(n),ids=new Set(curA.map(x=>x.id)),neu=replace?arr:arr.filter(x=>x&&x.id&&!ids.has(x.id));added+=neu.length;
  if(local){put(n,replace?arr:curA.concat(neu));try{localStorage.setItem(n==='chantiers'?LS:n==='compta'?LSC():LS+'-'+n,JSON.stringify(get(n)));}catch(_){alertBox('Mémoire du téléphone pleine pendant la restauration.');return;}}
  else{if(replace)for(const x of curA)if(!arr.some(y=>y.id===x.id)){try{await db.doc(n+'/'+x.id).delete();}catch(_){}}for(const x of neu){try{await db.doc(n+'/'+x.id).set(x);}catch(_){}}}}
 if(o.params&&(replace||!bkGet(LS+'-p'))){P=merge(o.params);await saveParams();}
 cur=null;view='ch';render();scheduleBackup();alertBox(replace?'Données restaurées.':`${added} élément${added>1?'s':''} ajouté${added>1?'s':''}.`);}

function vPal(c){

 const {P1,P2}=pallets(c),R=roofSVG(c,P1,plan(c).bands);const kg1=P1.reduce((s,p)=>s+p.kg,0),kg2=P2.reduce((s,p)=>s+p.kg,0);
 return `<h2>Plan de livraison sur le toit</h2>
 <p class="note" style="margin-top:4px">Vue du dessus à l'échelle. <b style="color:var(--ok)">D</b> = départ des travaux au point bas · <b style="color:var(--acc)">G</b> = point de levage · flèches = sens de pose · ronds bleus = évacuations · pointillés = bandes de travail par jour (B1, B2…).</p>
 <div class="plan" style="margin-top:10px">${R.svg}</div>
 <div class="leg">${R.placed.map(p=>`<div><span class="sw" style="background:${COL[p.k]||'#888'}">${p.n}</span><span><b>${esc(p.name)}</b><br><small style="color:var(--mut)">${nf(p.q)} ${plu(p.pack,p.q).split(' ')[0]} · ${nf(p.kg)} kg</small></span></div>`).join('')}</div>
 ${R.over?`<div class="warn">Le toit est petit pour autant de palettes : faites livrer en deux fois (étanchéité d'abord, isolation ensuite) ou stockez une partie au sol.</div>`:''}
 <div class="card sec"><h3>Pourquoi cette disposition</h3><ul style="margin:8px 0 0;padding-left:18px;font-size:15px;color:var(--mut)">
 <li>Les palettes sont posées le long du <b>point haut</b> : vous attaquez au point bas, loin d'elles, et elles ne gênent qu'en fin de couche.</li>

 <h3 style="margin-top:16px">Prix d'achat HT (CHF)</h3><div class="g2" style="margin-top:8px">${Object.entries(PRIXN).map(([k,l])=>num('prix.'+k,l,P.prix[k])).join('')}</div>
 <h3 style="margin-top:16px">Accessoires : prix d'achat (CHF) et heures de pose</h3><div class="g2" style="margin-top:8px">${ACC.map(([k,l,u])=>`<label class="f">${l}<span style="display:flex;gap:8px"><input class="t n" type="number" step="any" min="0" data-ap="${k}" value="${P.acc[k].p}" aria-label="Prix ${l}"><input class="t n" type="number" step="any" min="0" data-ah="${k}" value="${P.acc[k].h}" aria-label="Heures ${l}"></span><small>CHF / ${u} · h / ${u}</small></label>`).join('')}</div>
 <h3 style="margin-top:16px">Rendements (par personne)</h3><div class="g2" style="margin-top:8px">${Object.entries(PRODN).map(([k,l])=>num('prod.'+k,l,P.prod[k])).join('')}</div>
 <h3 style="margin-top:16px">Matériaux</h3><div class="g2" style="margin-top:8px">${num('recouv','Recouvrement des lés (%)',P.recouv)}${num('chute','Chute (%)',P.chute)}${num('primaire','Primaire (l/m²)',P.primaire)}${num('pvRoul','Pare-vapeur m²/rouleau',P.pvRoul)}${num('b1Roul','Bitume 1re couche m²/rouleau',P.b1Roul)}${num('b2Roul','Bitume ardoisé m²/rouleau',P.b2Roul)}${num('b1Pal','Rouleaux bitume / palette',P.b1Pal)}${num('fpoRoul','FPO m²/rouleau',P.fpoRoul)}${num('gazM2','m² soudés par bouteille 33 kg',P.gazM2)}${num('resKg','Résine kg/m²',P.resKg)}${num('gravEp','Gravier épaisseur (cm)',P.gravEp)}${num('taperSup','Supplément éléments de pente PIR (%)',P.taperSup)}${num('isoPalH','Hauteur palette isolation (m)',P.isoPalH)}${num('isoLay','Panneaux isolation par rang',P.isoLay)}${num('pvPal','Rouleaux pare-vapeur / palette',P.pvPal)}${num('b2Pal','Rouleaux ardoisés / palette',P.b2Pal)}</div>
 <div style="display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap"><button class="btn gh sm" type="button" id="preset">Valeurs par défaut</button><button class="btn" type="button" id="pclose">Fermer</button></div>`;
 d.showModal();bindBk(d);
 d.oninput=e=>{if(e.target.dataset.ls){try{localStorage.setItem(e.target.dataset.ls,e.target.value.trim());}catch(_){}return;}if(e.target.dataset.c){const k=e.target.dataset.c;P.cpt[k]=k==='assuj'?e.target.value==='1':e.target.value;return;}if(e.target.dataset.ap){P.acc[e.target.dataset.ap].p=+e.target.value||0;return;}if(e.target.dataset.ah){P.acc[e.target.dataset.ah].h=+e.target.value||0;return;}if(e.target.dataset.ob!=null){P.outilsBase=e.target.value;return;}if(e.target.dataset.e){const k=e.target.dataset.e;P.ent[k]=e.target.type==='number'?+e.target.value:e.target.value;return;}const k=e.target.dataset.p;if(!k)return;const v=+e.target.value;if(!(v>0))return;if(k.startsWith('prod.'))P.prod[k.slice(5)]=v;else if(k.startsWith('prix.'))P.prix[k.slice(5)]=v;else P[k]=v;};
 $('#pclose').onclick=()=>{d.close();saveParams();render();};
 $('#preset').onclick=()=>{P=JSON.parse(JSON.stringify(DEF));d.close();saveParams();render();};
}

/* ===================== ANALYSE PHOTO ===================== */
const shrink=file=>new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej();},'image/jpeg',.85);};img.onerror=()=>{URL.revokeObjectURL(u);rej();};img.src=u;});
async function addPhotos(files){let bad=0;for(const f of [...files].slice(0,4-photos.length)){let b=null;try{b=await shrink(f);}catch(_){if(/^image\/(jpeg|png|webp)$/.test(f.type)&&f.size<5e6)b=f;}if(!b){bad++;continue;}photos.push({b,url:URL.createObjectURL(b)});}
 pstat=bad?`${bad} photo(s) illisible(s) (format HEIC ?) : faites une capture d'écran de la photo.`:'';render();}
const androidSample=()=>{const f=async(p,o)=>({text:''});f.json=async(prompt,o)=>{const key=(()=>{try{return localStorage.getItem('havret-key')||'';}catch(_){return '';}})();if(!key)throw{code:'nokey'};
 const b64=await Promise.all((o.images||[]).map(b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(b);})));
 const id='a'+Date.now();let model='claude-sonnet-5-5';try{model=localStorage.getItem('havret-model')||model;}catch(_){}
 return new Promise((res,rej)=>{window.__aiCb=window.__aiCb||{};window.__aiCb[id]={res,rej};window.Android.analyse(id,key,model,prompt,JSON.stringify(b64));});};return f;};
window.__aiDone=(id,text,err)=>{const cb=(window.__aiCb||{})[id];if(!cb)return;delete window.__aiCb[id];if(err)return cb.rej({code:'api',message:err});try{cb.res(JSON.parse(text.slice(text.indexOf('{'),text.lastIndexOf('}')+1)));}catch(e){cb.rej({code:'parse'});}};
const getSample=async()=>{if(sample)return sample;if(window.Android&&window.Android.analyse){sample=androidSample();return sample;}try{const x=window.claude&&window.claude.use?await window.claude.use('sample'):null;if(x&&x.limits){const l=await x.limits();if(l&&l.images)sample=x;}}catch(_){}return sample;};
const pick=(v,ok,d)=>ok.includes(String(v))?String(v):d;
async function analyse(){
 const c=cur,el=()=>document.getElementById('pstat');pstat='<span class="spin"></span>Analyse en cours, environ 20 secondes…';el().innerHTML=pstat;
 if(!await getSample()){pstat="L'analyse photo n'est pas disponible dans cette fenêtre (ouvrez l'application sur claude.ai dans un navigateur). Remplissez la composition à la main.";render();return;}
 const g=geo(c),isPlan=c.photoKind==='plan';
 const planTxt=isPlan?`IMPORTANT : la ou les images sont un PLAN DE TOITURE (vue en plan, coupe ou détail), pas une photo. Lis les cotes écrites (en m, cm ou mm, converties en mètres). Donne en plus dans le JSON : "longueur_m", "largeur_m" (rectangle englobant), "surface_m2" (surface réelle à étancher, en déduisant les trémies et en additionnant les parties si la forme est en L ou découpée), "releves_ml" (longueur totale des acrotères et murs périphériques, y compris autour des lanterneaux et édicules), "acrotere_cm" (hauteur d'acrotère si indiquée, sinon null), "pente_pct" (pente indiquée sur le plan, sinon null), "trop_pleins" (nombre). Compte toutes les naissances, trop-pleins, cols de cygne, ventilations, lanterneaux, gaines et sorties dessinés ou légendés. Si une cote est illisible, mets null et signale-le dans "risques".\n`:'';
 const prompt=planTxt+`Tu es chef de chantier expert en étanchéité de toitures plates en Suisse romande (entreprise Havret Étanchéité). Analyse ${photos.length} photo(s) d'un chantier${g.A?` dont les dimensions saisies sont ${nf(g.L,1)} m × ${nf(g.W,1)} m`:''}.
Détermine la composition à réaliser selon les règles de l'art et la norme SIA 271:2021 (pente minimale 1,5 %, pare-vapeur sous isolation, relevés au-dessus de la couche de protection, évacuations avec trop-plein de sécurité, protection anti-chute). Ne cite aucun chiffre de norme dont tu n'es pas sûr. Une photo ne montre pas les couches cachées : reste prudent et dis ce qu'il faut vérifier.
Réponds UNIQUEMENT avec un objet JSON valide :
{"type":"plat|terrasse|vert|mur","etat":"neuf|reno","systeme":"bitume|fpo|epdm|resine","isolation_mm":0|100|120|140|160|180|200|240,"protection":"aucune|gravier|dalles|vege","evacuations":nombre,"garde_corps":true|false,"developpe_cm":nombre ou null,"portes_fenetres":nombre,"seuils_ml":nombre ou null,"traversees":nombre,"angles":nombre,"accessoires":{"naissL":nombre,"cdc":nombre,"vent":nombre,"aer":nombre,"lant":nombre,"chem":nombre,"pied":nombre,"ancr":nombre,"jd_ml":nombre,"couv_ml":nombre,"chen_ml":nombre},
"resume":"2 phrases pour le chef d'équipe",
"observations":["ce que tu vois : support, couches existantes, acrotères, évacuations, équipements, 2 à 5 éléments"],
"risques":["défauts visibles et risques : cloques, flaches, fissures de relevés, végétation, accès, sécurité ; 1 à 5 éléments"],
"conformite":["ce qu'il faut faire pour être conforme SIA 271 sur ce toit, 2 à 5 éléments"],
"conseils":["conseils d'exécution concrets : par où commencer, détails délicats, organisation, 2 à 5 éléments"]}
Règles : pour "mur", systeme bitume ou resine, isolation 0, protection aucune. "evacuations" = nombre visible, au moins 1 pour un toit. "developpe_cm" = hauteur estimée des relevés + retour si une échelle est visible, sinon null. "garde_corps" = vrai seulement si une protection collective existe sur tout le périmètre. "portes_fenetres" = portes-fenêtres donnant sur la surface ; "seuils_ml" = largeur totale estimée de leurs seuils (environ 1 m par porte si pas d'échelle) ; "traversees" = pieds de garde-corps, tuyaux, ventilations qui traversent l'étanchéité ; "angles" = angles rentrants et sortants des relevés. "accessoires" = éléments visibles : naissances latérales/gargouilles, cols de cygne (passages de câbles), ventilations, aérateurs, lanterneaux/coupoles, sorties de cheminée, pieds de garde-corps, points d'ancrage ; joints de dilatation, couvertines et chéneaux en mètres linéaires estimés ; 0 si absent. Signale dans "risques" un seuil trop bas pour un raccord correct. Écris en français.`;
 try{
  const r=await sample.json(prompt,{images:photos.map(p=>p.b),modelTier:'complex'});
  c.type=pick(r.type,Object.keys(TYPES),c.type);c.etat=pick(r.etat,['neuf','reno'],c.etat);
  c.sys=pick(r.systeme,c.type==='mur'?['bitume','resine']:Object.keys(SYS),c.sys);
  c.iso=c.type==='mur'?0:+pick(r.isolation_mm,['0','100','120','140','160','180','200','240'],String(c.iso));
  c.prot=c.type==='mur'?'aucune':pick(r.protection,Object.keys(PROT),c.prot);
  if(+r.evacuations>=0&&r.evacuations!=null)c.evac=Math.min(20,Math.round(+r.evacuations));
  c.garde=!!r.garde_corps;if(+r.portes_fenetres>=0){c.seuils=Math.round(+r.portes_fenetres)||0;c.seuilMl=+r.seuils_ml>0?Math.round(+r.seuils_ml*10)/10:c.seuils;}if(+r.traversees>=0)c.trav=Math.round(+r.traversees)||0;if(+r.angles>=0)c.angles=Math.round(+r.angles)||0;if(r.accessoires&&typeof r.accessoires==='object'){c.acc=c.acc||{};const A2=r.accessoires;for(const k of ['naissL','cdc','vent','aer','lant','chem','pied','ancr'])if(+A2[k]>=0)c.acc[k]=Math.round(+A2[k]);for(const [k,j] of [['jd','jd_ml'],['couv','couv_ml'],['chen','chen_ml']])if(+A2[j]>=0)c.acc[k]=Math.round(+A2[j]*10)/10;}if(+r.developpe_cm>0&&+r.developpe_cm<200)c.dev=Math.round(+r.developpe_cm);
  const A=a=>Array.isArray(a)?a.slice(0,5).map(x=>String(x).slice(0,240)):[];
  c.ai={resume:String(r.resume||'').slice(0,400),obs:A(r.observations),risques:A(r.risques),conf:A(r.conformite),conseils:A(r.conseils)};
  if(isPlan){if(+r.longueur_m>0)c.L=Math.round(+r.longueur_m*100)/100;if(+r.largeur_m>0)c.W=Math.round(+r.largeur_m*100)/100;if(+r.surface_m2>0){const s2=Math.round(+r.surface_m2*10)/10;c.surfO=Math.abs(s2-c.L*c.W)/(c.L*c.W||1)>0.03?s2:'';}if(+r.releves_ml>0)c.relMl=Math.round(+r.releves_ml*10)/10;if(+r.acrotere_cm>0)c.acrH=Math.round(+r.acrotere_cm);if(r.pente_pct!=null&&+r.pente_pct<1.5){c.pente='pentee';}if(+r.trop_pleins>=0&&r.trop_pleins!=null){c.acc=c.acc||{};c.acc.tp=Math.round(+r.trop_pleins);}}
  pstat='';persist();render();
 }catch(e){pstat=e&&e.code==='nokey'?"Ajoutez votre clé API Anthropic dans ⚙ (section Analyse photo).":e&&e.code==='api'?"Erreur de l'analyse : "+esc(e.message||''):e&&e.code==='rate_limited'?"Trop de demandes : réessayez dans une minute.":e&&e.code==='not_granted'?"Analyse non autorisée.":"L'analyse n'a pas abouti. Réessayez avec une photo plus nette ou plus large.";render();}
}

app.addEventListener('input',e=>{if(!cur)return;const el=e.target,id=el.id;
 if(el.dataset.ck){cur.check[el.dataset.ck]=el.checked;queue();render();return;}
 if(el.dataset.ot){cur.outil=cur.outil||{};cur.outil[el.dataset.ot]=el.checked;queue();render();return;}
 if(el.dataset.acc){cur.acc=cur.acc||{};cur.acc[el.dataset.acc]=el.value===''?'':Math.max(0,+el.value||0);queue();const k=document.querySelector('.kpi');if(k){const g=geo(cur),pl=plan(cur);k.innerHTML=`<div><span>Surface</span><b>${nf(g.A)} m²</b></div><div><span>Relevés</span><b>${nf(g.rel,1)} ml</b></div><div><span>Durée (${pl.team} pers.)</span><b>${nf(pl.days.length)} j</b></div><div><span>Prix de vente HT</span><b>${chf(cost(cur).ht)}</b></div>`;}return;}
 if(!id||!(id in cur)&&!Object.keys(NEW()).includes(id)&&!['devisSt','devisSent','rapTrav','rapRes','recDate','recWho','regSel','start'].includes(id))return;
 const nums=['surfO','penteP','canP','canK','acrH','L','W','dev','team','hday','evac','iso','seuils','seuilMl','trav','angles','acompteRecu'];
 cur[id]=el.type==='checkbox'?el.checked:id==='relMl'?(el.value===''?'':Math.max(0,+el.value)):nums.includes(id)?Math.max(0,+el.value||0):el.value;
 if(id==='devisSt'&&['envoye','relance'].includes(el.value)&&!cur.devisSent)cur.devisSent=today();
 if(id==='type'&&cur.type==='mur'&&!['bitume','resine'].includes(cur.sys))cur.sys='bitume';
 queue();
 if(el.tagName==='SELECT'||el.type==='checkbox'){render();}else{const k=document.querySelector('.kpi');if(k){const g=geo(cur),pl=plan(cur);k.innerHTML=`<div><span>Surface</span><b>${nf(g.A)} m²</b></div><div><span>Relevés</span><b>${nf(g.rel,1)} ml</b></div><div><span>Durée (${pl.team} pers.)</span><b>${nf(pl.days.length)} j</b></div><div><span>Prix de vente HT</span><b>${chf(cost(cur).ht)}</b></div>`;}if(id==='nom')$('#ttl').textContent=cur.nom||'Nouveau chantier';}
});
app.addEventListener('click',e=>{
 const o=e.target.closest('[data-open]');if(o){const c=list.find(x=>x.id===o.dataset.open);if(c){cur=JSON.parse(JSON.stringify(c));if(!cur.check)cur.check={};tab="metres";render();window.scrollTo(0,0);}return;}
 const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return;}
 if(e.target.id==='pdf'){const t=((document.querySelector('#doc .dt')||{}).textContent||'Document').replace('N° ','');if(window.Android&&window.Android.print){window.Android.print(t);}else{navigator.clipboard.writeText(docText(cur)).then(()=>{e.target.textContent='Copié ✓';},()=>{e.target.textContent='Copie impossible';});}return;}
 if(e.target.id==='shdoc'){window.Android.share(docText(cur));return;}
 const pk=e.target.closest('[data-pk]');if(pk){cur.photoKind=pk.dataset.pk;queue();render();return;}
 if(e.target.id==='analyse'){analyse();return;}
 if(e.target.id==='clearph'){photos=[];pstat='';render();return;}
 if(e.target.id==='dup'){const n={...JSON.parse(JSON.stringify(cur)),id:NEW().id,nom:(cur.nom||'Chantier')+' (copie)',check:{},statut:'prevu'};cur=n;persist();render();return;}
 if(e.target.id==='del'){const d=$('#dlg');d.innerHTML=`<h2>Supprimer ce chantier ?</h2><p style="margin-top:8px">« ${esc(cur.nom||'Sans nom')} » sera effacé définitivement.</p><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn gh sm" type="button" id="dno">Annuler</button><button class="btn sm" type="button" id="dyes">Supprimer</button></div>`;d.showModal();$('#dno').onclick=()=>d.close();$('#dyes').onclick=()=>{d.close();delChantier(cur.id);};}
});
app.addEventListener('change',e=>{if(e.target.dataset.photo&&e.target.files.length)addPhotos(e.target.files);});
$('#back').onclick=()=>{if(dirty){clearTimeout(tmr);persist();}cur=null;photos=[];pstat='';render();window.scrollTo(0,0);};
$('#gear').onclick=openParams;
window.__back=()=>{const d=$('#dlg');if(d.open){d.close();return true;}if(cur){$('#back').click();return true;}return false;};
render();initDb();
}
