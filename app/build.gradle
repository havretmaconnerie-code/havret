plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.havret.chantier'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.havret.chantier'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        havret {
            storeFile file('havret.keystore')
            storePassword 'havret2026'
            keyAlias 'havret'
            keyPassword 'havret2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.havret
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
